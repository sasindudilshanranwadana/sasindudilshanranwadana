<svg fill="none" viewBox="0 0 800 240" width="800" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner {
          font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #0B0C10;
          background-image: 
            radial-gradient(#1f2937 1px, transparent 1px),
            radial-gradient(120% 120% at 85% 15%, rgba(123,47,247,0.35) 0%, transparent 60%),
            radial-gradient(90% 90% at 15% 85%, rgba(255,46,99,0.30) 0%, transparent 55%);
          background-size: 20px 20px, 100% 100%, 100% 100%;
          border: 3px solid #08D9D6;
          box-shadow: 6px 6px 0px #FF2E63;
          border-radius: 12px;
          padding: 24px 32px;
          box-sizing: border-box;
          height: 240px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
        }

        .meta-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.18em;
          color: #08D9D6;
          border-bottom: 1px dashed rgba(8, 217, 214, 0.3);
          padding-bottom: 8px;
        }

        .title-row {
          display: flex;
          align-items: baseline;
          gap: 16px;
          margin-top: 4px;
        }

        .title {
          font-size: 34px;
          font-weight: 900;
          color: #F4EAD6;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          margin: 0;
          text-shadow: 3px 3px 0px #000, 4px 4px 0px #FF2E63;
        }

        .role-tag {
          background: #FFD400;
          color: #0B0C10;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 800;
          padding: 3px 8px;
          border-radius: 4px;
          border: 1.5px solid #000;
          box-shadow: 2px 2px 0px #000;
          letter-spacing: 0.05em;
        }

        .desc {
          color: #EAEAEA;
          font-size: 13.5px;
          font-weight: 500;
          line-height: 1.4;
          margin: 0;
        }

        .footer-tags {
          display: flex;
          gap: 10px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 10.5px;
          font-weight: 600;
        }

        .badge-cyan {
          background: rgba(8, 217, 214, 0.12);
          color: #08D9D6;
          border: 1px solid #08D9D6;
          padding: 3px 8px;
          border-radius: 4px;
        }

        .badge-pink {
          background: rgba(255, 46, 99, 0.12);
          color: #FF2E63;
          border: 1px solid #FF2E63;
          padding: 3px 8px;
          border-radius: 4px;
        }

        .badge-purple {
          background: rgba(123, 47, 247, 0.15);
          color: #a855f7;
          border: 1px solid #7B2FF7;
          padding: 3px 8px;
          border-radius: 4px;
        }

        .burst {
          position: absolute;
          right: 28px;
          top: 48px;
          background: #FF2E63;
          color: #FFF;
          font-weight: 900;
          font-size: 13px;
          font-family: 'Space Grotesk', sans-serif;
          padding: 6px 14px;
          transform: rotate(8deg);
          border: 2px solid #000;
          box-shadow: 3px 3px 0px #FFD400;
          letter-spacing: 0.05em;
        }
      </style>

      <div class="banner">
        <div class="meta-bar">
          <span>DARWIN · NT · AUSTRALIA</span>
          <span>LAT −12.46 · LONG 130.84</span>
          <span>SECURITY OPERATOR</span>
        </div>

        <div class="title-row">
          <h1 class="title">SASINDU RANWADANA</h1>
          <span class="role-tag">LEVEL α // SPECIALIST</span>
        </div>

        <p class="desc">
          Master of IT (Cybersecurity) @ CDU · Offensive &amp; Defensive Security · Cloud Infrastructure · Full-Stack &amp; FastMCP AI Automation Systems.
        </p>

        <div class="footer-tags">
          <span class="badge-cyan">🛡️ OFFENSIVE &amp; DEFENSIVE SEC</span>
          <span class="badge-pink">⚡ FULL-STACK ARCHITECT</span>
          <span class="badge-purple">🤖 AUTONOMOUS AI / MCP</span>
        </div>

        <div class="burst">ORIGIN #01</div>
      </div>
    </div>
  </foreignObject>
</svg>
